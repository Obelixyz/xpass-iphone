o.onclick=e=>{const b=e.target.closest("button");if(!b)return;o.remove();if(b.dataset.v!="1")return res(false);away();navigator.share({files:[f]}).then(()=>{back();toast("File salvato o inviato");res(true)},x=>{back();if(x&&x.name!="AbortError")say("Salvataggio non riuscito: "+(x.message||x.name));res(false)})}})}
/* Promemoria backup: compare se non è mai stato fatto, o se è più vecchio di 30 giorni e da allora ci sono modifiche */
const DAY=864e5;
function bkAge(){return V.lastBk?Math.floor((Date.now()-V.lastBk)/DAY):null}

/* "Impronta" dei dati: serve a capire se ci sono modifiche non ancora salvate in un backup e da quando (V.dirty) */
function dataSig(){const s=JSON.stringify([V.entries,V.groups]);let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(36)+"."+s.length}
function trackDirty(){if(!V.entries.length&&!V.lastBk){delete V.dirty;return}if(dataSig()===V.bkSig)delete V.dirty;else if(!V.dirty)V.dirty=Date.now()}
const bkCfg=()=>Object.assign({on:true,days:7},V.bkRem||{});
function bkDue(){const r=bkCfg();if(!r.on||!V.dirty||!V.entries.length)return false;if(V.bkSnooze&&Date.now()-V.bkSnooze<Math.min(7,r.days)*DAY)return false;return Date.now()-V.dirty>=r.days*DAY}

<div class="row2" style="margin-top:16px"><button data-v="0">Annulla</button><button class="p" data-v="1">✔ Salva</button></div></div>`;document.body.appendChild(o);

o.onclick=async e=>{const b=e.target.closest("[data-v]");if(!b)return;if(b.dataset.v=="1"){V.bkRem={on:o.querySelector("#bkon").checked,days:+o.querySelector("#bkd").value};delete V.bkSnooze;o.remove();await persist();render()}else o.remove()}}

if(!V.groups[e.group])V.groups[e.group]=(R.groups||{})[e.group]||{icon:GIC(e.group)}}return n}

/* iPhone (app web): Face ID / Touch ID tramite una passkey con estensione PRF (iOS 18 o successivo, Portachiavi iCloud).
   Dopo Face ID la passkey restituisce un segreto di 32 byte che esiste solo dentro il Portachiavi: da quel segreto
   si ricava la chiave AES che cifra la password principale salvata nel telefono (pk1). Senza Face ID il dato è illeggibile.
   Le chiamate a WebAuthn partono sempre direttamente dal tocco su un pulsante, come richiede Safari. */
const PKW=()=>!NATIVE&&!!window.PublicKeyCredential&&!!navigator.credentials&&isSecureContext;
async function pkAvail(){if(!PKW())return false;try{return await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()}catch(e){return false}}
const rnd32=()=>crypto.getRandomValues(new Uint8Array(32));
async function pkKey(out){const k=await crypto.subtle.importKey("raw",out,"HKDF",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"HKDF",hash:"SHA-256",salt:new Uint8Array(32),info:enc.encode("X-Pass sblocco biometrico v1")},k,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
const prfOut=c=>{try{const r=c.getClientExtensionResults().prf;return r&&r.results&&r.results.first||null}catch(e){return null}};
function pkGet(id,salt){return navigator.credentials.get({publicKey:{challenge:rnd32(),rpId:location.hostname,allowCredentials:[{type:"public-key",id:unb(id)}],userVerification:"required",timeout:120000,extensions:{prf:{eval:{first:unb(salt)}}}}})}
function pkCreate(salt){return navigator.credentials.create({publicKey:{rp:{name:"X-Pass",id:location.hostname},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:"X-Pass",displayName:"X-Pass · sblocco con "+BIOL},challenge:rnd32(),pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],authenticatorSelection:{authenticatorAttachment:"platform",residentKey:"required",requireResidentKey:true,userVerification:"required"},timeout:120000,extensions:{prf:{eval:{first:salt}}}}})}
/* Finestra il cui pulsante chiama subito fn (serve il tocco diretto per Face ID) */
function dlgNow(h,label,fn){const o=document.createElement("div");o.className="ov";o.innerHTML=`<div class="card" style="max-width:380px;width:100%;margin:0"><p style="margin:0 0 14px">${h}</p><div class="row2"><button data-v="0">Annulla</button><button class="p" data-v="1">${label}</button></div></div>`;document.body.appendChild(o);o.onclick=e=>{const b=e.target.closest("button");if(!b)return;o.remove();if(b.dataset.v=="1")fn()}}
const pkFail=e=>say(e&&e.name=="NotAllowedError"?"Operazione annullata.":"Non è stato possibile usare "+BIOL+": "+(e&&(e.message||e.name)||e)+"\n\nControlla in Impostazioni › Password › Opzioni password che sia attivo «Usa Portachiavi iCloud» / «Password».");
async function pkSave(id,out){await stSet("pk1",JSON.stringify(Object.assign({id},await seal({p:MP},await pkKey(out),ST.pkSalt))));back();say("Sblocco con "+BIOL+" attivato. Da ora nella pagina iniziale c'è il pulsante «Sblocca con "+BIOL+"».")}
/* Attivazione: crea la passkey; se iOS non restituisce già il segreto, chiede una seconda conferma */
function pkEnable(){const salt=rnd32();ST.pkSalt=salt;away();pkCreate(salt).then(async c=>{const id=b64(new Uint8Array(c.rawId)),ex=c.getClientExtensionResults().prf;
if(!ex||ex.enabled===false){back();return say("Questo iPhone non permette lo sblocco con "+BIOL+" per le app web (serve iOS 18 o successivo con il Portachiavi iCloud attivo). Continua a usare la password principale.")}
const out=prfOut(c);if(out)return pkSave(id,out);
dlgNow("Ultimo passo: conferma ancora una volta con "+BIOL+" per completare l'attivazione.","✔ Conferma",()=>{pkGet(id,b64(salt)).then(g=>{const o2=prfOut(g);if(!o2){back();return say("Questo iPhone non restituisce la chiave per lo sblocco: aggiorna iOS e riprova.")}return pkSave(id,o2)}).catch(e=>{back();pkFail(e)})})}).catch(e=>{back();pkFail(e)})}

/* Importazione da CSV (X-Pass, Chrome, Edge, Firefox, Bitwarden, LastPass, KeePass, 1Password, Dashlane, Proton Pass, Password Safe e simili) */
function parseCSV(t){t=t.replace(/^\ufeff/,"");const h=t.split(/\r?\n/)[0];const cnt=c=>{let n=0,q=false;for(const x of h){if(x=='"')q=!q;else if(x==c&&!q)n++}return n};const d=[";",",","\t"].sort((a,b)=>cnt(b)-cnt(a))[0];
const rows=[];let row=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==d){row.push(f);f=""}else if(c=="\n"||c=="\r"){if(c=="\r"&&t[i+1]=="\n")i++;row.push(f);rows.push(row);row=[];f=""}else f+=c}
if(f||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()))}
const COL={name:["titolo","title","name","nome","nome account"],group:["gruppo","categoria","category","group","grouping","folder","cartella","vault"],account:["account","nome utente","username","login_username","user name","user","login","utente","email","e-mail"],password:["password","login_password","pass","pwd"],url:["website","url","login_uri","sito","sito web","web site","uri"],comment:["commento","commenti","notes","note","extra","comments","nota"]};
const SKIP=["guid","timecreated","timelastused","timepasswordchanged","httprealm","formactionorigin","fav","favorite","reprompt","type","icon","last modified","created","createtime","modifytime",];
function csvEntries(rows){const H=rows[0].map(x=>x.trim().toLowerCase()),used=new Set(),ix={};for(const[k,names]of Object.entries(COL)){for(const n of names){const i=H.indexOf(n);if(i>=0&&!used.has(i)){ix[k]=i;used.add(i);break}}}
if(ix.password==null)return null;const lab={url:"Sito web"};const out=[];
for(const r of rows.slice(1)){const g=k=>ix[k]!=null?(r[ix[k]]||"").trim():"";const fields=[];if(g("url"))fields.push({id:uid(),label:"Sito web",type:"text",value:g("url")});
H.forEach((h,i)=>{if(used.has(i)||SKIP.includes(h))return;const v=(r[i]||"").trim();if(!v)return;if(h=="campi extra"){v.split(" | ").forEach(x=>{const k=x.indexOf(": ");if(k>0)fields.push({id:uid(),label:x.slice(0,k),type:"text",value:x.slice(k+2)})});return}fields.push({id:uid(),label:rows[0][i].trim(),type:/totp|pin|otp/i.test(h)?"pw":"text",value:v})});
let name=g("name");if(!name){const u=g("url");name=u?u.replace(/^\w+:\/\/(www\.)?/,"").split(/[\/?#]/)[0]:g("account")||"Senza nome"}
out.push({id:uid(),name,group:g("group")||"Importati",icon:"🔑",account:g("account"),password:g("password"),comment:g("comment"),fields,updated:Date.now()})}return out}
const GIC=g=>{g=g.toLowerCase();return /carta|carte|card|bancomat/.test(g)?"💳":/banc|bank/.test(g)?"🏦":/spid|cie|ident/.test(g)?"🛡️":/mail|pec/.test(g)?"📧":/social/.test(g)?"📱":/lavoro|work/.test(g)?"💼":/account/.test(g)?"👤":"🔑"};
async function importCSV(text){const rows=parseCSV(text);const E=rows.length>1&&csvEntries(rows);if(!E)return say("Non riconosco questo file. Si possono importare i backup di X-Pass (.vault) e i file CSV esportati da altri gestori di password. I database cifrati di altre app (.db, .kdbx…) non si possono leggere: esporta prima in CSV.");
const key=e=>[e.name,e.account,e.password].join("\u0001").toLowerCase(),have=new Set(V.entries.map(key)),nu=E.filter(e=>!have.has(key(e)));
if(!nu.length)return say("Tutti i "+E.length+" record di questo file sono già presenti.");
if(!await ask("Trovati "+E.length+" record, di cui "+nu.length+" nuovi"+(E.length-nu.length?" ("+(E.length-nu.length)+" già presenti verranno saltati)":"")+". Importarli?"))return;
for(const e of nu){const ex=Object.keys(V.groups).find(x=>x.toLowerCase()==e.group.toLowerCase());if(ex)e.group=ex;else V.groups[e.group]={icon:GIC(e.group)};V.entries.push(e)}
await persist();view={v:"home"};render();say("Importati "+nu.length+" record. Ricorda di eliminare il file CSV: contiene le password in chiaro.")}

/* Appunti sicuri: nell'app Android il testo è segnato come sensibile e cancellato dopo CLIPS secondi (anche se l'app è chiusa) */
/* App web (iPhone): Safari permette di scrivere negli appunti solo durante un tocco. Dopo CLIPS secondi si prova a
   cancellarli; se Safari non lo consente (o l'app era in secondo piano) si cancellano al primo tocco successivo dentro X-Pass. */
const CLIPS=30;let clipT=null,clipDue=0;
function clipClear(){const d=clipDue;if(!d||Date.now()<d||!navigator.clipboard)return;navigator.clipboard.writeText("").then(()=>{if(clipDue==d)clipDue=0},()=>{})}
["touchend","click","keydown"].forEach(e=>addEventListener(e,clipClear,true));
async function copySafe(v){const SC=plug("SecureClip");if(SC){try{await SC.copy({text:v,seconds:CLIPS});return true}catch(e){}}
try{await navigator.clipboard.writeText(v)}catch(e){return false}clipDue=Date.now()+CLIPS*1000;clearTimeout(clipT);clipT=setTimeout(clipClear,CLIPS*1000+50);return true}
function toast(m){let t=$("#toast");if(!t){t=document.createElement("div");t.id="toast";document.body.appendChild(t)}t.textContent=m;t.className="on";clearTimeout(t._h);t._h=setTimeout(()=>t.className="",2600)}

/* Modifica gruppo (nome e icona). Se il nuovo nome esiste già, propone di unire i due gruppi */
function editGroup(){const old=view.g;let icon=V.groups[old].icon;const o=document.createElement("div");o.className="ov";
o.innerHTML=`<div class="card" style="max-width:420px;width:100%;margin:0;max-height:88vh;overflow-y:auto"><b>Modifica gruppo</b><label style="margin-top:14px">Nome</label><input id="gn" value="${esc(old)}" autocomplete="off"><label style="margin-top:14px">Icona <span class="note">(tocca per cambiarla)</span></label><button id="gi" style="font-size:26px">${ic(icon)}</button><div id="gpk"></div><div class="err" id="ger"></div><div class="row2"><button data-v="0">Annulla</button><button class="p" data-v="1">✔ Salva</button></div></div>`;
document.body.appendChild(o);const pk=o.querySelector("#gpk");
o.onclick=async e=>{if(e.target.closest("#gi")){if(pk.innerHTML)pk.innerHTML="";else picker(pk,i=>{icon=i;o.querySelector("#gi").innerHTML=ic(i)});return}
const b=e.target.closest("[data-v]");if(!b)return;if(b.dataset.v=="0")return o.remove();const n=o.querySelector("#gn").value.trim();if(!n)return o.querySelector("#ger").textContent="Il nome del gruppo non può essere vuoto";o.remove();await saveGroup(old,n,icon)}}
async function saveGroup(old,n,icon){const ex=n===old?null:Object.keys(V.groups).find(x=>x!==old&&x.toLowerCase()==n.toLowerCase());if(ex&&!await ask("Esiste già il gruppo «"+ex+"». Spostare lì tutti i record di «"+old+"» e unire i due gruppi?"))return;
const to=ex||n,now=Date.now();if(to!==old){if(!ex)V.groups[to]=V.groups[old];delete V.groups[old];V.entries.forEach(e=>{if(e.group==old){e.group=to;e.updated=now}})}if(!ex)V.groups[to].icon=icon;await persist();view={v:"group",g:to};render()}

/* Lettura del file da importare: riconosce il backup .vault anche con caratteri invisibili in testa, codifica UTF-16 o JSON racchiuso fra virgolette */
async function readImport(f){const nm=(f.name||"").toLowerCase(),isV=/\.vault(\.\w+)?$/.test(nm);let u;try{u=new Uint8Array(await f.arrayBuffer())}catch(e){return{err:"Non riesco a leggere il file "+(f.name||"")+": "+(e&&e.message||e)}}
if(!u.length)return{err:"Il file "+(f.name||"")+" è vuoto (0 byte). Probabilmente il backup non è stato salvato bene: esportalo di nuovo."};
let t;if(u[0]==0xFF&&u[1]==0xFE)t=new TextDecoder("utf-16le").decode(u);else if(u[0]==0xFE&&u[1]==0xFF)t=new TextDecoder("utf-16be").decode(u);else t=new TextDecoder().decode(u);t=t.replace(/^[﻿​\s]+/,"");
const vt=x=>x&&typeof x=="object"&&x.s&&x.iv&&x.c?x:null;
const tryJ=s=>{try{let x=JSON.parse(s);if(typeof x=="string")x=JSON.parse(x);return vt(x)}catch(e){return null}};
let v=tryJ(t);if(!v){const a=t.indexOf("{"),b=t.lastIndexOf("}");if(a>=0&&b>a&&a<512)v=tryJ(t.slice(a,b+1))}
if(v)return{vault:v};
if(isV)return{err:"Questo backup .vault non è leggibile ("+u.length+" byte, inizio: «"+t.slice(0,24).replace(/[^\x20-\x7e]/g,"?")+"»). Forse si è danneggiato durante la copia: prova a esportarlo di nuovo dal telefono di partenza."};
return{text:t}}

/* Eventi */
function showGs(all){const el=$("#gs");if(!el||!cur||(!cur._new&&!cur._ed))return;const q=(cur.group||"").trim().toLowerCase();const l=Object.keys(V.groups).filter(g=>all||!q||g.toLowerCase().includes(q));el.innerHTML=l.map(g=>`<button data-a="gpick" data-g="${esc(g)}">${ic(V.groups[g].icon)} ${esc(g)}</button>`).join("");el.hidden=!l.length}
function picker(el,cb){const all=[...ICONS,...Object.keys(V.icons).map(i=>"img:"+i)];el.innerHTML=`<div class="pick pk">${all.map(i=>`<button data-ic="${i}">${ic(i)}</button>`).join("")}<button data-up="1" title="Carica la tua immagine">📷＋</button></div>`;el.onclick=ev=>{const b=ev.target.closest("button");if(!b)return;if(b.dataset.up)return addIcon(i=>{cb(i);el.innerHTML=""});if(b.dataset.ic){cb(b.dataset.ic);el.innerHTML=""}}}
const blank=()=>({id:uid(),_new:1,_ng:0,name:"",group:"",icon:"🔑",account:"",password:"",comment:"",fields:[],updated:0});
app.addEventListener("input",e=>{const t=e.target;if(t.id=="q"){Q=t.value;$("#hl").innerHTML=homeList();return}if(t.dataset.c){th()[t.dataset.c]=t.value;applyTheme();return}if(view.v!="entry")return;if(t.tagName=="TEXTAREA")fitTA(t);const c=t.closest(".pw");if(t.dataset.k)cur[t.dataset.k]=t.value;if(t.dataset.k=="group")showGs(false);
const card=t.closest("[data-fid]");if(card){const f=cur.fields.find(x=>x.id==card.dataset.fid);if(t.hasAttribute("data-fl"))f.label=t.value;if(t.hasAttribute("data-fv"))f.value=t.value}
if(c&&t.tagName=="INPUT"&&t.type!="range")c.querySelector(".m").innerHTML=meter(t.value)});
app.addEventListener("focusin",e=>{if(e.target.dataset&&e.target.dataset.k=="group")showGs(false)});
app.addEventListener("change",e=>{const t=e.target;if(t.dataset.c)persist();});
document.addEventListener("click",async ev=>{if(!ev.target.closest('[data-a="menu"]')){const m=$("#mn");if(m)m.remove()}
if(!ev.target.closest(".gbox")){const g=$("#gs");if(g)g.hidden=true}
const b=ev.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,pw=b.closest(".pw");
const setPw=v=>{const i=pw.querySelector("input[data-k],input[data-fv]");i.value=v;i.type="text";i.dispatchEvent(new Event("input",{bubbles:true}))};
const done=()=>{const o=$(".ov");if(o)o.remove()};
switch(a){
case"menu":{if($("#mn"))break;const items='<div class="mh">Sicurezza</div><button data-a="chk">🩺 Controllo password</button><button data-a="bio">'+FP+' Accesso biometrico'+(stGet("bio1")||stGet("pk1")?" ✔":"")+'</button><button data-a="chpw">🔑 Cambia password principale</button>'
+'<div class="mh">Backup e dati</div><button data-a="expenc">💾 Fai un backup cifrato<small>Ultimo: '+bkText()+'</small></button><button data-a="bkset">🔔 Promemoria backup<small>'+(bkCfg().on?'Dopo '+bkCfg().days+(bkCfg().days==1?' giorno':' giorni')+' di modifiche non salvate':'Disattivato')+'</small></button><button data-a="imp">📥 Importa backup o CSV</button><button data-a="expcsv">📄 Esporta elenco CSV<small>Non cifrato: password leggibili</small></button>'
+'<div class="mh">Aspetto</div><button data-a="theme">🎨 Personalizza</button><div class="note" style="padding:10px 16px;border-top:1px solid var(--bd);margin-top:6px">X-Pass '+VER+(NATIVE?'':IOS?' · iPhone':' · web')+(BUILD?' · build '+BUILD:'')+'</div>';const d=document.createElement("div");d.className="menu";d.id="mn";d.innerHTML=items;$(".bar").appendChild(d);break}
case"lock":lock();break;
case"home":view={v:"home"};render();break;
case"theme":view={v:"theme"};render();break;
case"grp":view={v:"group",g:b.dataset.n};render();break;
case"gedit":editGroup();break;
case"chk":pwCheck();break;
case"new":cur=blank();view.v="entry";render();break;
case"edit":cur._ed=1;render();break;
case"open":{const fs=view.v=="home";done();cur=JSON.parse(JSON.stringify(V.entries.find(x=>x.id==b.dataset.id)));cur._ng=0;cur._ed=0;cur._fs=fs;view={v:"entry",g:view.g};render();break}
case"back":if(view.v=="theme")view={v:"home"};else if(view.v=="entry")view=cur.group&&V.groups[cur.group]&&!cur._new&&!cur._fs?{v:"group",g:cur.group}:{v:"home"};else{view={v:"home"};Q=""}cur=null;render();break;
case"gdd":{const g=$("#gs");if(g&&!g.hidden)g.hidden=true;else showGs(true);break}
case"gpick":cur.group=b.dataset.g;$('[data-k="group"]').value=cur.group;$("#gs").hidden=true;break;
case"eicon":picker($("#ip"),i=>{cur.icon=i;$("#ei").innerHTML=ic(i)});break;
case"eye":{const i=(pw||b.parentNode).querySelector("input");i.type=i.type=="password"?"text":"password";break}
case"copy":{const i=(pw||b.parentNode).querySelector("input"),o=b.textContent;if(await copySafe(i.value)){b.textContent="✔";setTimeout(()=>b.textContent=o,1200);toast(NATIVE||!IOS?"Copiato · si cancella fra "+CLIPS+" s":"Copiato · dopo "+CLIPS+" s si cancella al primo tocco su X-Pass")}else{i.type="text";i.select()}break}
case"gtog":pw.querySelector(".gen").classList.toggle("o");break;
case"gen":setPw(gen(pw.querySelector(".gt").value,+pw.querySelector(".gl").value));break;
case"addt":case"addp":cur.fields.push({id:uid(),label:"",type:a=="addp"?"pw":"text",value:""});render();break;
case"rm":cur.fields=cur.fields.filter(f=>f.id!=b.closest("[data-fid]").dataset.fid);render();break;
case"save":{const n=(cur.name||"").trim();let g=(cur.group||"").trim();const ex=Object.keys(V.groups).find(x=>x.toLowerCase()==g.toLowerCase());if(ex)g=ex;if(!n)return say("Inserisci un nome");if(!g)return say("Scegli un gruppo o creane uno nuovo");cur.group=g;if(!V.groups[g])V.groups[g]={icon:cur.icon};cur.updated=Date.now();delete cur._new;delete cur._ng;delete cur._ed;delete cur._fs;const i=V.entries.findIndex(x=>x.id==cur.id);if(i<0)V.entries.push(cur);else V.entries[i]=cur;cleanup();await persist();view={v:"group",g};cur=null;render();break}
case"del":if(await ask("Eliminare questo record?")){V.entries=V.entries.filter(x=>x.id!=cur.id);V.del[cur.id]=Date.now();cleanup();await persist();view={v:"home"};cur=null;render()}break;
case"expcsv":if(await ask("Il file CSV contiene tutte le password in chiaro. Conservalo con cura. Continuare?")){done();await saveFile("x-pass-elenco.csv",csv(),"text/csv")}break;
case"expenc":done();await doBackup();break;
case"bkset":done();bkSet();break;
case"bklater":V.bkSnooze=Date.now();await persist();render();break;
case"bio":bioMenu();break;
case"imp":{const i=document.createElement("input");i.type="file";i.oncancel=back;i.onchange=async()=>{back();try{const f=i.files[0];if(!f)return;const r=await readImport(f);if(r.err)return say(r.err);if(!r.vault){const tx=r.text;if(/^\s*SQLite format|\u0000/.test(tx.slice(0,200)))return say("Questo file è un database cifrato di un'altra app e non si può leggere. Dall'altra app esporta i dati in formato CSV e importa quello.");return await importCSV(tx)}const d=r.vault;let R;try{R=await open(d,await derive(MP,unb(d.s)))}catch(e){const p=await askPw("Questo backup è stato creato con un'altra password principale. Inseriscila:");if(p==null)return;R=await open(d,await derive(p,unb(d.s)))}const nr=merge(R);if(R.lk&&R.lk.imgs){const n=LK.imgs.length;for(const x of R.lk.imgs)if(!LK.imgs.some(y=>y.id==x.id))LK.imgs.push(x);if(!await saveLK())LK.imgs.length=n}cleanup();await persist();applyTheme();render();say(nr?"Backup importato: "+nr+" record ripristinati.":"Backup importato: tutti i record del backup erano già presenti.")}catch(e){say("File non valido o password errata")}};away();i.click();break}
case"chpw":chPw();break;
case"skipi":ev.preventDefault();SKIPI=true;render();break;
case"pre":{const p=PRE[+b.dataset.i],t=th();t.bg=p[1];t.card=p[2];t.tx=p[3];t.ac=p[4];applyTheme();await persist();render();break}
case"pickc":colorModal(b.dataset.c,b.dataset.n);break;
case"libadd":pickImg(async us=>{V.lib.push(...us.map(u=>({id:uid(),u})));await persist();render()},1080,"image/jpeg",.6,true);break;
case"limg":{const x=V.lib.find(y=>y.id==b.dataset.id),fx=(V.theme||{}).imgId==x.id;modal(`<div class="prev"><img src="${x.u}"></div><div class="row2" style="flex-direction:column"><button data-a="limgfix" data-id="${x.id}">${fx?"📌 Togli come sfondo":"📌 Usa come sfondo"}</button><button data-a="limgk" data-id="${x.id}">🚪 Copia nella pagina iniziale</button><button class="d" data-a="limgdel" data-id="${x.id}">🗑 Elimina immagine</button><button data-a="close">Chiudi</button></div>`);break}
case"limgk":{const x=V.lib.find(y=>y.id==b.dataset.id);done();if(!LK.imgs.some(y=>y.u==x.u)){LK.imgs.push({id:uid(),u:x.u});if(!await saveLK())LK.imgs.pop()}render();break}
case"kadd":pickImg(async us=>{const n=LK.imgs.length;LK.imgs.push(...us.map(u=>({id:uid(),u})));if(!await saveLK()){LK.imgs.length=n}render()},1080,"image/jpeg",.6,true);break;
case"kimg":{const x=LK.imgs.find(y=>y.id==b.dataset.id);modal(`<div class="prev"><img src="${x.u}"></div><div class="row2" style="flex-direction:column"><button data-a="kfix" data-id="${x.id}">📌 Usa come sfondo fisso</button><button class="d" data-a="kdel" data-id="${x.id}">🗑 Elimina immagine</button><button data-a="close">Chiudi</button></div>`);break}
case"kmode":LK.mode=b.dataset.m;saveLK();render();break;
case"kfix":LK.fix=b.dataset.id;LK.mode="fix";saveLK();done();render();break;
case"kdel":if(await ask("Eliminare definitivamente questa immagine?")){LK.imgs=LK.imgs.filter(x=>x.id!=b.dataset.id);if(LK.fix==b.dataset.id)LK.fix=null;if(!LK.imgs.length)LK.mode="fix";saveLK();done();render()}break;
case"limgfix":{const t=th();t.imgId=t.imgId==b.dataset.id?null:b.dataset.id;done();applyTheme();await persist();render();break}
case"limgdel":if(await ask("Eliminare definitivamente questa immagine?")){const id=b.dataset.id,t=V.theme;V.lib=V.lib.filter(x=>x.id!=id);if(t){if(t.imgId==id)t.imgId=null}done();applyTheme();await persist();render()}break;

case"icrm":if(await ask("Eliminare questa icona? I record che la usano torneranno a 🔑.")){delete V.icons[b.dataset.id];await persist();render()}break;
case"treset":V.theme=null;applyTheme();await persist();render();break}});
/* Spazio "persistente": chiede al telefono di non cancellare mai i dati di X-Pass per fare spazio */
function keep(){try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{})}catch(e){}}

/* Funzionamento senza internet e aggiornamenti automatici (service worker, solo nell'app web).
   A ogni apertura e ogni volta che si torna su X-Pass si controlla se su GitHub c'è una versione nuova.
   Se c'è, viene scaricata per intero e poi l'app si ricarica: subito se si è nella pagina iniziale senza aver
   scritto nulla, altrimenti al blocco successivo. I dati non vengono toccati. */
let UPD=false,SWR=null,swLast=0;
function swCheck(){if(SWR&&navigator.onLine!==false&&Date.now()-swLast>30000){swLast=Date.now();SWR.update().catch(()=>{})}}
function swReady(){if(UPD&&!KEY){const m=$("#mp");if(!m||!m.value)location.reload()}}
if(!NATIVE&&"serviceWorker" in navigator&&isSecureContext){const had=!!navigator.serviceWorker.controller;
navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!had||UPD)return;UPD=true;swReady()});
navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>{SWR=r;swCheck()}).catch(()=>{});
addEventListener("online",swCheck);setInterval(swReady,3000)}

/* Avviso dopo un aggiornamento */
function verNote(){const v=VER+(BUILD?"."+BUILD:""),o=stGet("xver");if(o!==v){stSet("xver",v).catch(()=>{});if(o)toast("X-Pass aggiornato: versione "+VER+(BUILD?" · build "+BUILD:""))}}

stInit().then(()=>{loadLK();render();verNote()});
